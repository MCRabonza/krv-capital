<style>
:root{
  --base:#0d1f17; --forest:#142d23; --slide:#142d26; --cream:#f7f3e7; --muted:#a8b5ae;

  --display:"miller-display","Miller Display",serif;
  --sans:"articulat-cf","Articulat CF",sans-serif;
  --bar:52px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--base);color:var(--cream);font-family:var(--sans);font-weight:300;overflow:hidden}
body{padding-top:72px}
/* Sub-bar, as pulse.krv.co's ticker row: label left, pager centre, actions right. */
.sub{height:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center}
.sub-in{width:100%;max-width:1440px;margin:0 auto;padding:0 clamp(40px,5vw,80px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
@media (max-width:768px){.sub-in{padding:0 16px;grid-template-columns:auto 1fr}.sub .lbl{display:none}}
.lbl{font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--jade);white-space:nowrap}
.lbl b{color:var(--cream);font-weight:500}
.pager{display:flex;align-items:center;gap:6px;justify-self:center}
.btn{font-family:var(--sans);font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--cream);
  background:transparent;border:1px solid rgba(247,243,231,0.18);height:30px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--jade);color:var(--jade-lt)}
.btn:disabled{opacity:.3;cursor:default}
.btn.arrow{width:34px;padding:0;justify-content:center;font-size:14px;letter-spacing:0}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn.gold:hover{background:var(--gold);color:var(--base)}
.count{white-space:nowrap;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;min-width:92px;text-align:center}
.count input{width:34px;background:transparent;border:0;border-bottom:1px solid rgba(247,243,231,0.25);color:var(--cream);font:inherit;text-align:center}
.acts{display:flex;gap:8px;justify-self:end}
@media (max-width:560px){#print,.acts .x{display:none}.acts{gap:6px}.pw{display:none}.acts .btn{padding:0 9px}.count{min-width:0}}
/* Stage: one page at a time, fitted to the window. */
.stage{position:relative;height:calc(100% - var(--bar));display:flex;align-items:center;justify-content:center;padding:24px max(clamp(40px,5vw,80px),calc((100% - 1440px)/2 + clamp(40px,5vw,80px))) 28px;user-select:none}
@media (max-width:768px){.stage{padding:24px 16px 28px}}
.stage:fullscreen{height:100%;padding:0;background:var(--base)}.stage:-webkit-full-screen{height:100%;padding:0;background:var(--base)}.stage:fullscreen .hint,.stage:-webkit-full-screen .hint{display:none}.stage:fullscreen .sheet,.stage:-webkit-full-screen .sheet{box-shadow:none}
.sheet{position:relative;background:var(--slide);box-shadow:0 18px 50px rgba(0,0,0,.45);line-height:0}
.sheet canvas{display:block;width:100%;height:100%}
.hit{position:absolute;top:0;bottom:0;width:50%;cursor:pointer;z-index:2}
.hit.l{left:0;cursor:w-resize}.lnk{position:absolute;z-index:3;display:block;cursor:pointer}.lnk:hover{outline:2px solid rgba(212,168,83,.7)}.hit.r{right:0;cursor:e-resize}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.msg .k{font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--jade)}
.msg h1{font-family:var(--display);font-style:italic;font-weight:400;font-size:32px;line-height:1.1}
.msg p{font-size:13px;line-height:1.6;color:rgba(247,243,231,.6);max-width:440px}
.msg a{color:var(--gold)}
.hint{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:rgba(247,243,231,.28)}
@media (max-width:768px){.hint{display:none}}
[hidden]{display:none!important}
@media print{body>*{display:none!important}}
.btn.arrow{border:0;width:26px;height:30px;padding:0;color:var(--cream)}.btn.arrow svg,.btn.icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.btn.arrow:hover:not(:disabled),.btn.icon:hover:not(:disabled){color:var(--gold);border-color:transparent}.btn.icon{border:0;width:30px;padding:0;justify-content:center}.pager{gap:10px}.count{min-width:0;font-size:11px;letter-spacing:.18em;font-variant-numeric:tabular-nums}.count input{width:22px;border-bottom:0;padding:0}.count input:focus{outline:none;border-bottom:1px solid var(--gold)}.hint{display:none!important}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--base);font-weight:600}.btn.gold:hover{background:#e2bb6a;border-color:#e2bb6a;color:var(--base)}
.acts .btn.gold{width:180px;height:32px;padding:0;justify-content:center;box-sizing:border-box;font-weight:500;font-size:10px;letter-spacing:.16em;gap:0}
.stage .fsx{position:absolute;top:14px;right:14px;z-index:3000;width:40px;height:40px;display:none;align-items:center;justify-content:center;background:rgba(13,31,23,.72);border:1px solid rgba(247,243,231,.28);color:#F7F3E7;cursor:pointer;padding:0}.stage .fsx svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}.stage .fsx:hover{color:#D4A853;border-color:#D4A853}.stage:fullscreen .fsx,.stage:-webkit-full-screen .fsx,.stage.fsm .fsx{display:flex}

<style>
.topbar{
  --bg:#0d1f17; --cream:#F7F3E7; --accent:#4A8F7E; --accent-lt:#6FB39E;

  --rail:clamp(40px, 5vw, 80px); --page-max:1440px; --topbar-h:72px;
  position:fixed; top:0; left:0; right:0;
  height:var(--topbar-h);
  background:var(--bg);
  border-bottom:1px solid var(--border);
  z-index:950;
  box-sizing:border-box;
  /* Inherited metrics of pulse.krv.co body, which the nav links pick up there. */
  font-family:var(--sans); font-size:13px; font-weight:300; line-height:1.6;
}
.topbar *{box-sizing:border-box;margin:0;padding:0}
.topbar-inner{
  height:100%;
  max-width:var(--page-max);
  margin:0 auto;
  padding: 0 var(--rail);
  display:flex; align-items:center; justify-content:space-between;
}
@media (max-width:768px){ .topbar-inner{ padding:0 24px; } }
.topbar-left,
.topbar-right { display:flex; align-items:center; gap:0; flex-wrap:nowrap; }
.tb-wordmark { display:inline-flex; align-items:center; line-height:0; }
.tb-wordmark img { display:block; height:22px; width:auto; }
.tb-nav { display:flex; align-items:center; gap:32px; }
.tb-nav a {
  font-family:var(--sans); font-size:11px; font-weight:500;
  letter-spacing:0.16em; text-transform:uppercase;
  color:var(--cream); text-decoration:none;
  transition: color 0.15s ease;
  white-space:nowrap;
}
.tb-nav a:hover { color:var(--accent-lt); }
.tb-nav a.is-active { color:var(--accent); }
.tb-nav a.is-active:hover { color:var(--accent); }
.tb-divider {
  width:1px; height:18px;
  background: rgba(247,243,231,0.18);
  margin: 0 24px;
}
/* Phone: the primary links give way; Clients and Investors stay. */
@media (max-width:980px){ .tb-nav-primary, .tb-divider { display:none; } }
@media (max-width:420px){ .tb-nav { gap:20px; } .tb-wordmark img { height:19px; } }
@media print{ .topbar{ display:none; } }
/* Always reserve the scrollbar, as pulse.krv.co does, so the 1440 frame centres identically. */
html{ overflow-y:scroll; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
(function(){
  // The signed link comes in the hash (#u=...), so it never reaches a server log.
  var u=(new URLSearchParams(location.hash.slice(1))).get('u')||'';
  var local=/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  var okUrl=/^https:\/\/kraion-terminal\.vercel\.app\/api\/intake\/deck\?t=[\w.\-]+$/.test(u)||(local&&/^\/[\w\/.\-]+\.(pdf|bin)$/.test(u));
  var msg=document.getElementById('msg'), sheet=document.getElementById('sheet'), cv=document.getElementById('cv');
  var pgIn=document.getElementById('pg'), tot=document.getElementById('tot');
  var prev=document.getElementById('prev'), next=document.getElementById('next');
  var pbtn=document.getElementById('print'), dbtn=document.getElementById('dl');
  var NAME='KRV & Co. 2027 Capital Programme.pdf';
  var doc=null, n=1, blobUrl='', busy=false, want=0;

  function fail(){
    msg.innerHTML='<div class="k">KRV &amp; Co. / Investors</div><h1>This link has expired.</h1>'+
      '<p>Deck links last 24 hours. <a href="../2027/#deck">Open the deck again</a> with your email, or write to <a href="mailto:mcr@krv.co">mcr@krv.co</a>.</p>';
    msg.hidden=false; sheet.hidden=true;
  }
  if(!okUrl||!window.pdfjsLib){ fail(); return; }
  // Tracking (MCR, 27/11): the deck link names the reader to Terminal; page time counts only while the tab is in front.
  try{ window.krvDeckToken=(new URL(u, location.href)).searchParams.get('t')||''; }catch(x){}
  var K=window.krv||{track:function(){},flush:function(){},visibleSeconds:function(){return 0}}, cur=0;
  function pageTime(){ var s=K.visibleSeconds(); if(cur&&s>0) K.track('page_view',{page:cur,seconds:Math.min(s,3600)}); }
  window.krvOnHide=pageTime; addEventListener('pagehide',function(){ pageTime(); K.flush(); });
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  fetch(u,{credentials:'omit'})
    .then(function(r){ if(!r.ok) throw r.status; return r.arrayBuffer(); })
    .then(function(buf){
      blobUrl=URL.createObjectURL(new Blob([buf],{type:'application/pdf'}));
      return pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
    })
    .then(function(d){
      doc=d; tot.textContent=String(d.numPages).padStart(2,'0'); msg.hidden=true; sheet.hidden=false; document.getElementById('hint').hidden=false;
      pbtn.disabled=dbtn.disabled=false; fsb.disabled=false;
      K.track('deck_open'); K.flush();
      var h=parseInt((location.hash.match(/[&#]p=(\d+)/)||[])[1],10); go(h||1);
    })
    .catch(function(e){
      // Network or CORS refusal: hand the browser the PDF itself rather than leave a blank page.
      if(typeof e!=='number'&&okUrl&&!local){ location.replace(u); return; }
      fail();
    });

  function fit(vp){
    var st=document.getElementById('stage'), cs=getComputedStyle(st);
    var aw=st.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
    var ah=st.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
    return Math.min(aw/vp.width, ah/vp.height);
  }
  function render(){
    if(!doc) return;
    if(busy){ want=1; return; } busy=true;
    doc.getPage(n).then(function(p){
      var base=p.getViewport({scale:1}), s=fit(base), dpr=Math.min(window.devicePixelRatio||1,3);
      var vp=p.getViewport({scale:s*dpr});
      var w=Math.floor(base.width*s), h=Math.floor(base.height*s);
      var off=document.createElement('canvas'); off.width=Math.floor(vp.width); off.height=Math.floor(vp.height);
      return p.render({canvasContext:off.getContext('2d'),viewport:vp,background:'rgba(0,0,0,0)'}).promise.then(function(){
        sheet.style.width=w+'px'; sheet.style.height=h+'px';
        cv.width=off.width; cv.height=off.height; cv.getContext('2d').drawImage(off,0,0);
        [].slice.call(sheet.querySelectorAll('.lnk')).forEach(function(e){e.remove()});
        var vs=p.getViewport({scale:s});
        return p.getAnnotations().then(function(an){
          an.forEach(function(a){
            if(a.subtype!=='Link'||!a.url||!/^https:\/\//.test(a.url)) return;
            var r=vs.convertToViewportRectangle(a.rect), el=document.createElement('a');
            el.className='lnk'; el.href=a.url; el.target='_blank'; el.rel='noopener';
            el.style.left=Math.min(r[0],r[2])+'px'; el.style.top=Math.min(r[1],r[3])+'px';
            el.style.width=Math.abs(r[2]-r[0])+'px'; el.style.height=Math.abs(r[3]-r[1])+'px';
            sheet.appendChild(el);
          });
        });
      });
    }).then(function(){ busy=false; if(want){ want=0; render(); } }, function(){ busy=false; });
  }
  function go(k){
    if(!doc) return;
    n=Math.max(1,Math.min(doc.numPages,k)); if(n!==cur){ pageTime(); cur=n; } pgIn.value=String(n).padStart(2,'0');
    prev.disabled=n<=1; next.disabled=n>=doc.numPages;
    history.replaceState(null,'','#u='+encodeURIComponent(u)+'&p='+n);
    render();
  }
  prev.onclick=function(){go(n-1)}; next.onclick=function(){go(n+1)};
  document.getElementById('hl').onclick=function(){go(n-1)}; document.getElementById('hr').onclick=function(){go(n+1)};
  pgIn.addEventListener('change',function(){go(parseInt(pgIn.value,10)||n)});
  pgIn.addEventListener('focus',function(){pgIn.select()});
  document.addEventListener('keydown',function(e){
    if(e.target===pgIn||e.ctrlKey||e.metaKey||e.altKey) return;
    var k=e.key;
    if(k==='ArrowRight'||k==='ArrowDown'||k==='PageDown'||k===' '){e.preventDefault();go(n+1);}
    else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'){e.preventDefault();go(n-1);}
    else if(k==='Home'){e.preventDefault();go(1);}
    else if(k==='End'&&doc){e.preventDefault();go(doc.numPages);}
    else if((k==='f'||k==='F')&&!fsb.hidden&&!fsb.disabled){e.preventDefault();toggleFs();}
  });
  var wheelAt=0;
  document.getElementById('stage').addEventListener('wheel',function(e){
    e.preventDefault(); var t=Date.now(); if(t-wheelAt<350||Math.abs(e.deltaY)<8) return; wheelAt=t; go(n+(e.deltaY>0?1:-1));
  },{passive:false});
  var tx=0,ty=0;
  document.getElementById('stage').addEventListener('touchstart',function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
  document.getElementById('stage').addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
    if(Math.max(Math.abs(dx),Math.abs(dy))>40) go(n+((Math.abs(dx)>Math.abs(dy)?dx:dy)<0?1:-1));
  },{passive:true});
  // A new link pasted into the same tab only changes the hash: start again from it.
  window.addEventListener('hashchange',function(){location.reload()});
  var fsb=document.getElementById('fs'), stg=document.getElementById('stage');
  var fsOk=!!(stg.requestFullscreen||stg.webkitRequestFullscreen);
  fsb.hidden=!fsOk;
  function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement}
  function toggleFs(){
    if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
    else{(stg.requestFullscreen||stg.webkitRequestFullscreen).call(stg);}
  }
  fsb.addEventListener('click',function(){ K.track('fullscreen'); toggleFs(); });
  document.getElementById('fsx').addEventListener('click',function(e){e.stopPropagation();if(fsEl())(document.exitFullscreen||document.webkitExitFullscreen).call(document);});
  function fsChange(){fsb.innerHTML=fsEl()?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4l-6 6M14 4v6h6M4 20l6-6M10 20v-6H4"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7"/></svg>';fsb.title=fsEl()?'Exit full screen (Esc)':'Full screen (F)';fsb.setAttribute('aria-label',fsEl()?'Exit full screen':'Full screen');setTimeout(render,60);}
  document.addEventListener('fullscreenchange',fsChange);document.addEventListener('webkitfullscreenchange',fsChange);
  var rt; window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(render,120)});

  dbtn.onclick=function(){ if(!blobUrl) return; K.track('download'); K.flush(); var a=document.createElement('a'); a.href=blobUrl; a.download=NAME; document.body.appendChild(a); a.click(); a.remove(); };
  pbtn.onclick=function(){
    if(!blobUrl) return; K.track('print'); K.flush();
    var f=document.getElementById('pf'); if(f) f.remove();
    f=document.createElement('iframe'); f.id='pf'; f.style.cssText='position:fixed;width:0;height:0;border:0;right:0;bottom:0';
    f.onload=function(){ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(x){ window.open(blobUrl,'_blank'); } };
    f.src=blobUrl; document.body.appendChild(f);
  };
})();
</script>

document.getElementById('share').addEventListener('click',function(e){ e.stopPropagation(); if(window.krv) krv.openShare(this); });
document.querySelectorAll('a.btn.gold').forEach(function(b){ b.addEventListener('click',function(){ if(window.krv){ krv.track('request_allocation'); krv.flush(); } }); });
