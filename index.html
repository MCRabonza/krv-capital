<style>
:root{
  --base:#0d1f17; --forest:#142d23; --cream:#f7f3e7; --muted:#a8b5ae;
  --jade:#4a8f7e; --line:rgba(74,143,126,.28); --e2:#D4A853;
  --display:"miller-display","Miller Display",serif;
  --sans:"articulat-cf","Articulat CF",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--base);color:var(--cream);font-family:var(--sans);min-height:100%}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 16px}
.wrap{width:100%;max-width:880px}
.brand{font-family:var(--display);font-size:34px;letter-spacing:.01em;color:var(--cream);text-decoration:none}
.label{margin-top:56px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--jade);font-weight:700}
h1{font-family:var(--display);font-style:italic;font-weight:400;font-size:clamp(40px,7vw,64px);line-height:1.05;margin-top:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:44px}
.card{display:block;background:var(--forest);border:1px solid var(--line);padding:32px 30px 30px;color:var(--cream);text-decoration:none;transition:border-color .15s}
.card:hover,.card:focus-visible{border-color:var(--jade);outline:none}
.card .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--e2);font-weight:700}
.card h2{font-family:var(--display);font-style:italic;font-weight:400;font-size:30px;line-height:1.1;margin-top:14px}
.card p{font-size:15px;line-height:1.5;color:var(--muted);margin-top:12px}
.card .go{display:inline-block;margin-top:24px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--cream);border-bottom:1px solid var(--jade);padding-bottom:3px}
.foot{margin-top:48px;font-size:12px;line-height:1.6;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.foot a{color:var(--cream)}
@media (max-width:640px){.grid{grid-template-columns:1fr}.label{margin-top:40px}}
</style>
</head>
<body>
<main class="wrap">
  <a class="brand" href="https://www.krv.co">KRV&amp;Co.</a>
  <div class="label">Investors</div>
  <h1>Investor Relations</h1>
  <div class="grid">
    <a class="card" href="roadshow/">
      <div class="k">By email</div>
      <h2>2027 Roadshow</h2>
      <p>The investor deck. Enter your email to open it.</p>
      <span class="go">Open the Roadshow</span>
    </a>
    <a class="card" href="https://os.krv.co/login.html">
      <div class="k">By invitation</div>
      <h2>Shareholder Login</h2>
      <p>For shareholders. Sign in to KRV OS.</p>
      <span class="go">Sign in</span>
    </a>
  </div>
  <div class="foot">KRV &amp; Co. · <a href="mailto:mcr@krv.co">mcr@krv.co</a></div>
</main>
</body>
</html>
